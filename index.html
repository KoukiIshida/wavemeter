<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ウェーブメーター</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#10192e; --panel:#1b2742; --panel2:#24324f; --text:#f4f6fb; --muted:#9aa6c0;
  --accent:#ffcc33; --danger:#e5484d; --ok:#3ccf7a; --blue:#2f7de1;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  -webkit-tap-highlight-color:transparent}
img{max-width:100%}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 18px;background:#3a4a6b;color:#fff;font-weight:700}
button:hover{filter:brightness(1.1)}
button.primary{background:var(--accent);color:#1a1a1a}
button.blue{background:var(--blue)}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid #4a5a7c;color:var(--text)}
button.small{padding:6px 12px;font-size:13px;border-radius:8px}
button.big{font-size:22px;padding:16px 36px}
button:disabled,button.done{background:#4a4f5a !important;color:#9aa0aa !important;cursor:not-allowed;filter:none}
input[type=text],input[type=number],textarea,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #4a5a7c;background:#0d1526;color:var(--text)}
input[type=text],textarea{width:100%}
input[type=number]{width:90px;text-align:right}
h1,h2,h3{margin:0 0 12px}
.muted{color:var(--muted)}
.page{max-width:1100px;margin:0 auto;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.center{justify-content:center}
.spacer{flex:1}
.card{background:var(--panel);border-radius:14px;padding:16px;margin-bottom:14px}
.note{background:#2c2410;border:1px solid #6b5520;color:#ffe9a8;border-radius:10px;padding:10px 14px;margin-bottom:12px}

/* ===== ヘッダー ===== */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.topbar .title{font-size:22px;font-weight:900;letter-spacing:.05em;margin-right:6px}
.round-label{background:var(--accent);color:#1a1a1a;border-radius:8px;padding:3px 12px;font-weight:900}
.round-label.practice{background:#7a4dd8;color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700}
.chip .dot{width:9px;height:9px;border-radius:50%;background:#666}
.chip .dot.on{background:var(--ok)}
.chip .x{background:none;padding:0 2px;color:var(--muted);font-size:14px}
.chip.used{opacity:.6}
.chip .usedmark{font-size:11px;background:#556;border-radius:6px;padding:1px 6px}
.chip.giver{background:var(--accent);color:#1a1a1a}

/* ===== ホスト ===== */
.lobby{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 0}
.qrbox{display:inline-block;background:#fff;padding:14px;border-radius:12px;line-height:0}
.url{word-break:break-all;font-size:14px;color:var(--muted);margin-top:8px}
.plist{display:flex;flex-direction:column;gap:8px;min-width:280px;max-height:420px;overflow:auto}
.pitem{background:var(--panel2);border-radius:10px;padding:10px 14px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.stage{text-align:center;padding:10px 0}
.stage h2{font-size:30px}
.giver-big{font-size:64px;font-weight:900;color:var(--accent);margin:14px 0;min-height:80px}
.giver-big.spin{color:#fff;opacity:.85}
.timer{font-size:110px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;margin:10px 0}
.timer .unit{font-size:36px;margin-left:6px}
.timer.zero{color:var(--danger)}
.timer-label{font-size:22px;font-weight:800;color:var(--muted)}
.timer-label.think{color:#7cc4ff}
.timer-label.guess{color:#ffb86b}
.btnbar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.item-box{display:flex;align-items:center;justify-content:center;gap:14px;font-size:30px;font-weight:900;margin:10px 0;flex-wrap:wrap}
.item-box .l,.item-box .r{background:var(--panel2);border-radius:12px;padding:8px 18px}
.swap-cand{font-size:24px;font-weight:900;text-align:center;margin:10px 0;padding:12px;background:#f4f1e4;border-radius:10px}
.result-score{font-size:34px;font-weight:900;margin:14px 0}
.result-score .pts{font-size:80px;color:var(--accent)}
.result-banner{text-align:center;border-radius:14px;padding:18px;margin-bottom:14px}
.result-banner.clear{background:linear-gradient(135deg,#1e9b53,#3ccf7a)}
.result-banner.fail{background:linear-gradient(135deg,#5a1a1d,#a3262b)}
.result-banner .big{font-size:56px;font-weight:900}
.final-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{background:var(--panel);border-radius:12px;padding:12px 14px;text-align:center}
.stat .lbl{font-size:15px;color:var(--muted);font-weight:700}
.stat .val{font-size:44px;font-weight:900}
.stat .val small{font-size:18px;color:var(--muted)}

/* ===== メーター ===== */
.meter{--mh:74px;--mf:24px;margin:8px 0 6px;user-select:none;-webkit-user-select:none}
.meter-row{display:flex}
.meter-row>div{flex:1 1 0;min-width:0;text-align:center;font-weight:900;white-space:nowrap;overflow:visible;display:flex;justify-content:center}
.mark-top,.mark-bot{height:34px;align-items:flex-end;font-size:15px}
.mark-bot{align-items:flex-start}
.mark-top span,.mark-bot span{display:inline-block;border-radius:6px;padding:1px 6px;line-height:1.3}
.mark-top span{background:#fff;color:#c92a2a}
.mark-bot span{background:var(--blue);color:#fff}
.meter-bar{display:flex;border-radius:12px;overflow:hidden;border:3px solid #fff;background:#2a3550}
.mcell{flex:1 1 0;min-width:0;height:var(--mh);display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-right:1px solid rgba(255,255,255,.18);color:#fff;font-weight:900;line-height:1.05;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.mcell:last-child{border-right:none}
.mcell .n{font-size:var(--mf)}
.mcell .p{font-size:calc(var(--mf) * .58);opacity:.95;margin-top:2px}
.mcell.target{box-shadow:inset 0 0 0 4px #fff}
.mcell.answer{box-shadow:inset 0 0 0 4px var(--blue)}
.mcell.target.answer{box-shadow:inset 0 0 0 4px #fff, inset 0 0 0 8px var(--blue)}
.mcell.pick{cursor:pointer}
.mcell.pick:hover{background:#3d4d72}
.mcell.sel{background:var(--accent) !important;color:#1a1a1a;text-shadow:none}
.meter-ends{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-weight:900;font-size:22px}
.meter-ends .le{text-align:left} .meter-ends .re{text-align:right}
.meter-ends span{background:var(--panel2);border-radius:8px;padding:4px 10px;display:inline-block}
.legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0;font-size:14px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border-radius:999px;padding:3px 10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px}
.pick-info{font-size:26px;font-weight:900;margin:8px 0}
.pick-info b{color:var(--accent);font-size:44px}

/* ===== ルール説明 ===== */
.rule-display{text-align:left;max-width:1100px;margin:20px auto 28px;line-height:1.7;font-size:22px}
.rule-red{color:#c0392b;background:#f0f0f0;border:1px solid #ddd;padding:1px 7px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.rule-normal{color:#222}
.rule-display, .rule-display *{color:#fff !important}
.rule-display *:not(.rule-red){background-color:transparent !important}
.rule-display .rule-red, .rule-display .rule-red *{color:#e5342b !important}
.rule-display .rule-red{background:#fff !important;border:none}
.rule-display [style*="font-size"]:not([style*="1.5em"]), .rule-display font[size]{font-size:inherit !important}
.rule-display h1, .rule-display h2, .rule-display h3, .rule-display h4, .rule-display p{font-size:inherit !important;margin:0;font-weight:inherit}
.rule-img{border-radius:8px;margin-bottom:10px;cursor:zoom-in;max-height:50vh}

/* ===== 参加者（スマホ） ===== */
body.sub .page{max-width:520px;padding:10px}
body.sub .meter{--mh:52px;--mf:15px}
body.sub .mark-top,body.sub .mark-bot{height:26px;font-size:11px}
body.sub .meter-ends{font-size:14px}
.sub-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:8px}
.role-banner{border-radius:10px;padding:8px 10px;text-align:center;font-size:20px;font-weight:900;margin-bottom:10px;background:var(--accent);color:#1a1a1a}
.p-center{text-align:center;padding:40px 16px}
.p-item{background:var(--panel);border-radius:12px;padding:12px;text-align:center;margin-bottom:10px}
.p-item .lbl{font-size:13px;color:var(--muted);font-weight:700}
.p-item .pair{display:flex;align-items:center;justify-content:center;gap:8px;font-size:20px;font-weight:900;margin-top:6px;flex-wrap:wrap}
.p-item .pair span{background:var(--panel2);border-radius:8px;padding:4px 10px}
.p-num{font-size:72px;font-weight:900;color:var(--accent);line-height:1.1}
.p-timer{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums}
.bottom-btns{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.bottom-btns button{padding:14px;font-size:17px}
.spinner{width:40px;height:40px;border:4px solid #3a4a6b;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== モーダル・トースト ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;color:#1d1d1f;border-radius:14px;padding:20px;max-width:460px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.modal p{margin:6px 0}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal button{background:#e3e6ec;color:#1d1d1f}
.modal button.primary{background:var(--accent)}
.modal button.danger{background:var(--danger);color:#fff}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:14px;cursor:pointer}
.chk input{margin-top:3px;transform:scale(1.2)}
.img-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:150}
.img-modal img{max-width:92vw;max-height:92vh}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:200;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:#222c44;color:#fff;border-radius:12px;padding:10px 18px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .2s ease-out;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ===== 保存オーバーレイ ===== */
.save-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:300}
.save-overlay.active{display:flex}
.save-box{background:#fff;color:#222;padding:24px 30px;border-radius:12px;text-align:center;min-width:260px}
.save-box .spinner{border-color:#ddd;border-top-color:#e0a800}
.save-bar-outer{background:#eee;border-radius:6px;height:10px;margin-top:10px;overflow:hidden}
.save-bar-inner{background:#e0a800;height:100%;width:0%;transition:width .2s}

/* ===== 管理 ===== */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid #33415f;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700;white-space:nowrap}
.table-wrap{overflow-x:auto}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-weight:800;font-size:13px;white-space:nowrap}
.tag.clear{background:var(--ok);color:#10301c}
.tag.fail{background:var(--danger);color:#fff}
.tag.practice{background:#7a4dd8;color:#fff}
.ex-list{display:flex;flex-wrap:wrap;gap:8px}
.ex-item{background:var(--panel2);border-radius:8px;padding:6px 8px 6px 12px;display:inline-flex;align-items:center;gap:8px;font-weight:700}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.set-grid{display:grid;grid-template-columns:200px 1fr;gap:12px 16px;align-items:center}
.set-grid>.lbl{font-weight:800}
.tier-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.tier-row i{display:inline-block;width:16px;height:16px;border-radius:4px}
.err-text{color:#ff8a8e;font-weight:700;font-size:14px}
.sticky-actions{position:sticky;bottom:0;background:var(--bg);padding:10px 0;z-index:5;border-top:1px solid #2a3654}
.rich-toolbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.rich-toolbar button{padding:4px 10px;font-size:13px;border-radius:6px}
.rule-edit{border:1px solid #ccc;border-radius:6px;min-height:70px;padding:10px;background:#fff;color:#222;text-align:left;line-height:1.6}
.rule-slide-card{border:1px solid #33415f;border-radius:10px;padding:10px;margin-bottom:10px;background:#16213a}
.rule-group-block{margin-bottom:10px}
.thumb{max-width:160px;max-height:120px;display:block;border-radius:6px;cursor:zoom-in}
@media (max-width:700px){ .stats4,.final-stats{grid-template-columns:repeat(2,1fr)} .set-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>
<div class="save-overlay" id="save-overlay"><div class="save-box"><div class="spinner"></div><div id="save-msg">保存中…</div>
  <div style="font-size:22px;font-weight:900" id="save-pct">0%</div><div class="save-bar-outer"><div class="save-bar-inner" id="save-bar"></div></div></div></div>

<script>
/* =========================================================
   ウェーブメーター
   ・パラメータなし     … ホスト画面（PC：QR表示・ルール説明・進行）
   ・?room=XXXX        … 参加者画面（スマホ：出題者にだけ数字を表示。お題はホスト画面だけ）
   ・?mode=admin       … 管理ページ（ルール説明・ゲーム設定・履歴・除外・お題リスト）
   ========================================================= */
const GAME_TITLE = 'ウェーブメーター';
const ROOM_PREFIX = 'wmeter-';
const MIN_PLAYERS = 2;
/* お題（スプレッドシート「単語リスト」E列＝メーターの左端／F列＝右端。横並びがセット） */
const DEFAULT_ITEMS = [["悪い映画（タイトル）","良い映画（タイトル）"],["ツルツル","ふさふさ"],["覚えにくい","覚えやすい"],["熱い","冷たい"],["食べにくい食べ物","きれいに食べられる食べ物"],["静かな場所","うるさい場所"],["丸みのある動物","とげとげしい動物"],["柔らかい","固い"],["過小評価されているスキル","過大評価されているスキル"],["悪人","ヒーロー"],["好き嫌い分かれる調味料","誰でも好きな調味料"],["女性寄りの趣味","男性寄りの趣味"],["踊りにくい曲","踊りやすい曲"],["バカっぽいアニメキャラ","賢いアニメキャラ"],["真面目な仕事","面白い仕事"],["古風な名前","今どきの名前"],["パーティ会場になさそう","パーティ会場にありそう"],["田舎にありそう","都会にありそう"],["無人島で役に立たない","無人島で役に立つ"],["擬音語じゃない","擬音語"],["コアなトランプゲーム","誰でも知ってるトランプゲーム"],["紙幣に採用したくない人","紙幣に採用したい人"],["裸ではやらない","裸でやる"],["ソファで食べるもの","テーブルで食べるもの"],["ゆっくり進むもの","速く進むもの"],["悪い言い訳","良い言い訳"],["AIにやらせるべき仕事","自分がやるべき仕事"],["インドアな趣味","アウトドアな趣味"],["マイナーな歴史上人物","メジャーな歴史上人物"],["少ないほど良いもの","多いほど良いもの"],["AIの悪い使い方","AIの良い使い方"],["変わった趣味","普通の趣味"],["最近あまり見ないもの","最近よく見るもの"],["昼間の飲み物","夜の飲み物"],["怖い映画","怖くない映画"],["受け入れられる嘘","受け入れられない嘘"],["不名誉なこと","名誉なこと"],["外食っぽい料理","自炊っぽい料理"],["開けにくいもの","開けやすいもの"],["手づかみで食べる","食器で食べる"],["キックっぽい(NG:あし,きっく)","パンチっぽい(NG:て,ぱんち)"],["ウェディングに適していない場所","ウェディングに適した場所"],["子供向け映画","大人向け映画"],["一人で食べる","一緒に食べる"],["告白に不適切な場所","告白に適切な場所"],["デートに合わない映画","デートに合う映画"],["闘って負ける動物","闘って勝てる動物"],["カラオケに不向きな曲","カラオケに向きの曲"],["白い飲み物","黒い飲み物"],["かっこよくない髪型","かっこいい髪型"],["目玉焼きにかけない調味料","目玉焼きにかける調味料"],["習得が簡単な楽器","習得が難しい楽器"],["居酒屋っぽくない食べ物","居酒屋っぽい食べ物"],["犬の名前","人の名前"],["忍者が持ってなさそう","忍者が持ってそう"],["子供の食べ物","大人の食べ物"],["フィギュアスケートに合わない曲","フィギュアスケートに合う曲"],["丸い食べ物","三角形の食べ物"],["身長が低い芸能人","身長が高い芸能人"],["宇宙でやりたくないこと","宇宙でやりたいこと"]];

const LS = { items:'wmeter_items', used:'wmeter_used', excluded:'wmeter_excluded', history:'wmeter_history', state:'wmeter_host_state', room:'wmeter_room' };
const SS_PID='wmeter_pid', SS_NAME='wmeter_name';
const DB_NAME='wavemeter', STORE='kv', DATA_KEY='appData';
/* 得点帯の色（誤差が小さい帯から順に） */
const ZONE_COLORS=['#e03131','#f76707','#e8a200','#2f9e44','#1c7ed6','#7048e8','#c2255c'];
const NO_ZONE='#33405e';

const params = new URLSearchParams(location.search);
const MODE = params.get('mode')==='admin' ? 'admin' : (params.get('room') ? 'sub' : 'host');
document.body.classList.add(MODE);

/* ---------- 共通ユーティリティ ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function lsGet(k, def){ try{ const v=localStorage.getItem(k); return v==null?def:JSON.parse(v); }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ alert('ブラウザへの保存に失敗しました'); } }
function fmtDate(t){ const d=new Date(t), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function fmtDuration(ms){ const s=Math.round(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60; return (h?`${h}時間`:'')+`${m}分${String(sec).padStart(2,'0')}秒`; }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function stripHtml(h){ return String(h||'').replace(/<[^>]*>/g,'').replace(/&nbsp;/g,' ').trim(); }
function toInt(v){ const s=String(v==null?'':v).replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[－ー−]/g,'-').trim(); return /^-?\d+$/.test(s) ? parseInt(s,10) : NaN; }

function openModal(html, buttons){
  const wrap=document.createElement('div');
  wrap.className='modal-bg';
  wrap.innerHTML=`<div class="modal">${html}<div class="modal-btns"></div></div>`;
  const close=()=>wrap.remove();
  (buttons||[{label:'閉じる'}]).forEach(b=>{
    const el=document.createElement('button');

/* ---------- 設定・採点 ---------- */
function defaultSettings(){
  return { thinkSec:60, guessSec:60, meterMin:0, meterMax:20,
           tiers:[{err:0,pts:3},{err:1,pts:2},{err:2,pts:1}],
           clearMul:2, clearAdd:0, practiceFirst:false,
           weights:[1,2,4], weightsV:2 };   // 数字の出やすさ ①両端・真ん中／②その隣／③その他（1つの数字あたりの重み）
}
const DEFAULT_RULE_SLIDES=[{img:null, groups:[
  '毎回ランダムで<b>出題者</b>を1人決めます。それ以外の全員が<b>解答者</b>です。',
  '<span class="rule-red">お題</span>はこの画面に、<span class="rule-red">数字</span>は出題者のスマホにだけ表示されます。',
  '解答者は相談して、メーターの数字を1つ答えます。',
  '出題者の数字に近いほど高得点！　合計点がクリア点数以上ならクリアです。'
]}];
function defaultAppData(){ return { ruleSlides:JSON.parse(JSON.stringify(DEFAULT_RULE_SLIDES)), settings:defaultSettings() }; }
function normalizeSettings(s){
  const d=defaultSettings(); s=Object.assign({}, d, s||{});
  ['thinkSec','guessSec','meterMin','meterMax','clearMul','clearAdd'].forEach(k=>{ const v=toInt(s[k]); s[k]=isNaN(v)?d[k]:v; });
  s.tiers=(Array.isArray(s.tiers)?s.tiers:d.tiers).map(t=>({err:toInt(t.err), pts:toInt(t.pts)})).filter(t=>!isNaN(t.err)&&!isNaN(t.pts));
  s.tiers.sort((a,b)=>a.err-b.err);
  s.practiceFirst=!!s.practiceFirst;
  let w=Array.isArray(s.weights)?s.weights.map(toInt):[];
  // 旧初期値（1:2:1）のまま保存されていたデータは、正しい初期値（1:2:4）に直す
  if(s.weightsV!==2 && w.join(',')==='1,2,1') w=[1,2,4];
  s.weightsV=2;
  s.weights = w.length===3 && w.every(x=>!isNaN(x)&&x>=0) && w.some(x=>x>0) ? w : d.weights.slice();
  return s;
}
/**
 * 数字の分類（0=①／1=②／2=③）
 * ①両端の数字と真ん中の数字（数字の個数が偶数なら真ん中の2つ）
 * ②両端から1つずれた数字と、真ん中から1つずれた数字（偶数なら真ん中2つの外側）
 * ③その他
 */
function numberClasses(min, max){
  const sum=min+max;
  const mids = sum%2===0 ? [sum/2] : [Math.floor(sum/2), Math.ceil(sum/2)];
  const c1=new Set([min, max, ...mids]);
  const c2=new Set([min+1, max-1, mids[0]-1, mids[mids.length-1]+1].filter(v=>v>=min && v<=max && !c1.has(v)));
  const out=[];
  for(let v=min; v<=max; v++) out.push({v, cls: c1.has(v)?0 : c2.has(v)?1 : 2});
  return out;
}
/** 各数字の出る確率 [{v, cls, p}] */
function numberProbs(s){
  const list=numberClasses(s.meterMin, s.meterMax);
  let total=list.reduce((a,x)=>a+s.weights[x.cls],0);
  if(total<=0){ list.forEach(x=>x.p=1/list.length); return list; }
  list.forEach(x=>x.p=s.weights[x.cls]/total);
  return list;
}
function mergeAppData(d){
  const m=Object.assign(defaultAppData(), d||{});
  if(!Array.isArray(m.ruleSlides)||!m.ruleSlides.length) m.ruleSlides=JSON.parse(JSON.stringify(DEFAULT_RULE_SLIDES));
  m.ruleSlides.forEach(s=>{ if(!Array.isArray(s.groups)||!s.groups.length) s.groups=['']; if(s.img===undefined) s.img=null; });
  m.settings=normalizeSettings(m.settings);
  return m;
}
/** 誤差→得点帯の番号（どの帯にも入らなければ -1） */
function tierIndex(diff, tiers){ const d=Math.abs(diff); for(let i=0;i<tiers.length;i++) if(d<=tiers[i].err) return i; return -1; }
function ptsFor(diff, tiers){ const i=tierIndex(diff, tiers); return i<0 ? 0 : tiers[i].pts; }
function tierText(t){ return t.err===0 ? 'ピッタリ' : `誤差±${t.err}以内`; }
function clearTarget(n, s){ return n*s.clearMul + s.clearAdd; }
function clearFormula(s){ return `問題数 × ${s.clearMul}${s.clearAdd>=0?' ＋ '+s.clearAdd:' − '+(-s.clearAdd)}`; }

/**
 * 長方形のメーター
 * o = {min,max,tiers, target(正解・任意), answer(解答・任意), zones(得点帯の色を出す), pick(数字を選べる), sel(選択中), left,right(両端のお題)}
 */
function meterHtml(o){
  const n=o.max-o.min+1;
  const step = n<=31 ? 1 : Math.ceil(n/20);
  const cells=[], top=[], bot=[];
  for(let v=o.min; v<=o.max; v++){
    const isT = o.target!=null && v===o.target, isA = o.answer!=null && v===o.answer;
    let bg='', ptxt='';
    if(o.zones && o.target!=null){
      const ti=tierIndex(v-o.target, o.tiers);
      bg = ti<0 ? NO_ZONE : ZONE_COLORS[ti % ZONE_COLORS.length];
      if(ti>=0) ptxt=`${o.tiers[ti].pts}点`;
    }
    const showNum = step===1 || (v-o.min)%step===0 || v===o.max || isT || isA || v===o.sel;
    const cls=['mcell']; if(isT) cls.push('target'); if(isA) cls.push('answer'); if(o.pick) cls.push('pick'); if(o.sel===v) cls.push('sel');
    cells.push(`<div class="${cls.join(' ')}" data-num="${v}" style="${bg?`background:${bg}`:''}"><span class="n">${showNum?v:''}</span>${ptxt&&n<=31?`<span class="p">${ptxt}</span>`:''}</div>`);
    top.push(`<div>${isT?'<span>★正解</span>':''}</div>`);
    bot.push(`<div>${isA?'<span>▲解答</span>':''}</div>`);
  }
  const hasTop=o.target!=null, hasBot=o.answer!=null;
  return `<div class="meter">
    ${hasTop?`<div class="meter-row mark-top">${top.join('')}</div>`:''}
    <div class="meter-bar">${cells.join('')}</div>
    ${hasBot?`<div class="meter-row mark-bot">${bot.join('')}</div>`:''}
    ${o.left!=null||o.right!=null ? `<div class="meter-ends"><div class="le">◀ <span>${esc(o.left)}</span></div><div class="re"><span>${esc(o.right)}</span> ▶</div></div>` : ''}
  </div>`;
}
function legendHtml(tiers){
  return `<div class="legend">${tiers.map((t,i)=>`<span><i style="background:${ZONE_COLORS[i%ZONE_COLORS.length]}"></i>${tierText(t)}：${t.pts}点</span>`).join('')}<span><i style="background:${NO_ZONE}"></i>それ以外：0点</span></div>`;
}

/* ---------- IndexedDB（管理データ） ---------- */
function openDb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(){ const db=await openDb(); return new Promise((res,rej)=>{ const rq=db.transaction(STORE,'readonly').objectStore(STORE).get(DATA_KEY); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); }); }
async function idbSet(v){ const db=await openDb(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(v,DATA_KEY); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }
let appData=defaultAppData();
async function loadAppData(){ try{ appData=mergeAppData(await idbGet()); }catch(e){ appData=defaultAppData(); } }

/* ---------- お題リスト・使用状況・除外（3-8 お題プール管理） ---------- */
function itemKey(it){ return it[0]+' ⇔ '+it[1]; }
function getItemList(){
  const w=lsGet(LS.items, null);
  const list = Array.isArray(w)&&w.length ? w : DEFAULT_ITEMS;
  const seen=new Set(), out=[];
  list.forEach(it=>{ if(!Array.isArray(it)) return; const l=String(it[0]||'').trim(), r=String(it[1]||'').trim(); if(!l||!r) return; const k=itemKey([l,r]); if(seen.has(k)) return; seen.add(k); out.push([l,r]); });
  return out;
}
function getUsed(){ return new Set(lsGet(LS.used, [])); }
function setUsed(s){ lsSet(LS.used, [...s]); }
function getExcluded(){ return new Set(lsGet(LS.excluded, [])); }
function setExcluded(s){ lsSet(LS.excluded, [...s]); }
function getHistory(){ return lsGet(LS.history, []); }
function setHistory(h){ lsSet(LS.history, h); }
/** まだ使っていない（かつ除外されていない）お題。skip（キー）に入っているお題も除く */
function availablePool(skip){
  const used=getUsed(), ex=getExcluded(), sk=new Set(skip||[]);
  return getItemList().filter(it=>{ const k=itemKey(it); return !used.has(k) && !ex.has(k) && !sk.has(k); });
}
function usableCount(){ const ex=getExcluded(); return getItemList().filter(it=>!ex.has(itemKey(it))).length; }
/**
 * お題を1つ選んで使用済みにする。onBoard（今出ているお題のキー）は選ばない。
 * 未使用がない時は、使用状況のリセットを確認してから選ぶ（今出ているお題はリセット後も使用済み扱い）。キャンセル時は null。
 */
function pickItem(onBoard){
  onBoard=onBoard||[];
  let pool=availablePool(onBoard), didReset=false;
  if(!pool.length){
    if(usableCount()-onBoard.length < 1){ alert('使えるお題がありません。管理ページで除外リストやお題リストを確認してください。'); return null; }
    if(!confirm('未使用のお題がなくなりました。\n\nお題の使用状況をリセットしますか？\n（除外したお題はそのままです）')) return null;
    setUsed(new Set()); didReset=true;
    pool=availablePool(onBoard);
  }
  const it=pool[Math.floor(Math.random()*pool.length)];
  const used=getUsed(); used.add(itemKey(it));
  if(didReset) onBoard.forEach(k=>used.add(k));
  setUsed(used);
  return it;
}

   ホスト画面

let gs=null, peer=null, myHostId=null;
const conns={};             // pid -> conn
const connected=new Set();  // 接続中の pid
let drawAnimTimer=null, tickTimer=null, beepedTimerId=null, audioCtx=null;

function freshState(){
  return { phase:'lobby', players:{}, order:[], usedGivers:[], lastGiver:null,
           ruleSlideIndex:0, ruleRevealIndex:0, settings:null, round:null, timer:null,
           rounds:[], boardWords:[], startedAt:null, finalResult:null };
}
function S(){ return gs.settings || appData.settings; }
function genRoomId(){ return ROOM_PREFIX + String(Math.floor(100000+Math.random()*900000)); }
function joinUrl(){ return myHostId ? location.origin+location.pathname+'?room='+encodeURIComponent(myHostId) : ''; }
function pname(pid){ const p=gs.players[pid]; return p?p.name:'（退出）'; }
function connectedPids(){ return gs.order.filter(pid=>gs.players[pid] && connected.has(pid)); }
function countedRounds(){ return gs.rounds.filter(r=>!r.practice); }
function isPracticeNow(){ return !!S().practiceFirst && gs.rounds.length===0; }
function roundLabel(){ return isPracticeNow() ? '例題' : `第${countedRounds().length+1}問`; }

async function initHost(){
  requestWakeLock();
  await loadAppData();
  const saved=lsGet(LS.state,null), room=lsGet(LS.room,null);
  const resumable = saved && room && saved.phase!=='final' && (saved.phase!=='lobby' || Object.keys(saved.players||{}).length);
  if(resumable && confirm('前回の続きから再開しますか？\n\nOK：続きから再開（同じQRのまま）\nキャンセル：新しい部屋を作る')){
    gs=Object.assign(freshState(), saved);
    if(gs.round) gs.round.revealed=true;   // 抽選演出の途中で閉じた場合
    startPeer(room, 0);
  } else {
    localStorage.removeItem(LS.state); localStorage.removeItem(LS.room);
    gs=freshState();
    startPeer(null, 0);
  }
  document.getElementById('app').addEventListener('click', onHostClick);
  tickTimer=setInterval(tickHostTimer, 200);
  renderHost();
}
function startPeer(roomId, retry){
  const id=roomId||genRoomId();
  if(peer){ try{ peer.destroy(); }catch(e){} }
  peer=new Peer(id);
  peer.on('open', pid=>{ myHostId=pid; lsSet(LS.room, pid); saveState(); renderHost(); });
  peer.on('connection', conn=>{
    conn.on('data', data=>handleSubMessage(conn, data));
    conn.on('close', ()=>{
      const pid=conn._pid;
      if(pid && conns[pid]===conn){ delete conns[pid]; connected.delete(pid); renderHost(); }
    });
  });
  peer.on('error', err=>{
    if(err && err.type==='unavailable-id'){
      if(roomId && retry<5){ setTimeout(()=>startPeer(roomId, retry+1), 3000); }
      else { showToast('部屋番号を新しくしました。スマホはQRから入り直してください', 5000); startPeer(null, 0); }
    } else { console.error(err); }
  });
  peer.on('disconnected', ()=>{ try{ peer.reconnect(); }catch(e){} });
}
function saveState(){ lsSet(LS.state, gs); }
function commit(){ saveState(); syncAll(); renderHost(); }
function sendTo(pid, msg){ const c=conns[pid]; if(c && c.open){ try{ c.send(msg); }catch(e){} } }
function syncAll(){ Object.keys(conns).forEach(pid=>sendTo(pid, snapshotFor(pid))); }
function timerInfo(){
  const t=gs.timer; if(!t) return null;
  return { id:t.id, kind:t.kind, remainingMs:Math.max(0, t.endsAt-Date.now()), durMs:t.durMs };
}
/** 参加者に送る画面情報（参加者は毎回これで上書きするだけ） */
function snapshotFor(pid){
  const r=gs.round, s=S();
  const inRound=['selected','think','guess'].includes(gs.phase) && r && r.revealed;
  const isGiver=!!(inRound && r.giverId===pid);
  return {
    type:'state', title:GAME_TITLE, phase:gs.phase, name:pname(pid),
    label: r ? r.label : '', giverName: inRound ? pname(r.giverId) : '',
    isGiver, target: isGiver && gs.phase!=='selected' ? r.target : null,   // 数字は「出題開始」から。お題はホスト画面だけ（スマホには送らない）
    meter:{min:s.meterMin, max:s.meterMax, tiers:s.tiers},
    timer: isGiver && gs.phase==='think' ? timerInfo() : null,   // 予想シンキングタイムの時間は出題者には出さない
    roundId: r ? r.id : null
  };
}
function handleSubMessage(conn, data){
  if(!data || !data.type) return;
  if(data.type==='join'){
    let pid=String(data.pid||''); const name=String(data.name||'').trim().slice(0,12);
    if(!pid || !name) return;
    if(!gs.players[pid]){
      // タブを閉じて入り直した人：同じニックネームで切断中の人がいれば、その人として復帰
      const same=gs.order.find(p=>gs.players[p] && gs.players[p].name===name);
      if(same && !connected.has(same)){
        gs.players[pid]=gs.players[same]; delete gs.players[same];
        gs.order=gs.order.map(p=>p===same?pid:p);
        gs.usedGivers=gs.usedGivers.map(p=>p===same?pid:p);
        if(gs.lastGiver===same) gs.lastGiver=pid;
        if(gs.round && gs.round.giverId===same) gs.round.giverId=pid;
      } else if(same){ try{ conn.send({type:'name_taken'}); }catch(e){} return; }
      else { gs.players[pid]={name}; gs.order.push(pid); }
    } else {
      if(gs.order.some(p=>p!==pid && gs.players[p] && gs.players[p].name===name)){ try{ conn.send({type:'name_taken'}); }catch(e){} return; }
      gs.players[pid].name=name;
    }
    const old=conns[pid];
    conn._pid=pid; conns[pid]=conn; connected.add(pid);
    if(old && old!==conn){ try{ old.close(); }catch(e){} }
    commit();
    return;
  }
}

/* ----- 進行 ----- */
function startGame(withRule){
  if(connectedPids().length<MIN_PLAYERS){ alert(`参加者が${MIN_PLAYERS}人以上必要です`); return; }
  loadAppData().then(()=>{
    gs.settings=JSON.parse(JSON.stringify(appData.settings));   // ゲーム中は開始時点の設定で固定
    gs.rounds=[]; gs.usedGivers=[]; gs.lastGiver=null; gs.round=null; gs.timer=null; gs.boardWords=[]; gs.finalResult=null;
    gs.startedAt=Date.now();
    const hasRule=appData.ruleSlides.some(s=>s.img || s.groups.some(g=>stripHtml(g)));
    if(withRule && hasRule){ gs.phase='rule'; gs.ruleSlideIndex=0; gs.ruleRevealIndex=0; }
    else gs.phase='ready';
    commit();
  });
}
function advanceRule(){
  const slides=appData.ruleSlides, slide=slides[gs.ruleSlideIndex];
  if(gs.ruleRevealIndex < slide.groups.length-1) gs.ruleRevealIndex++;
  else if(gs.ruleSlideIndex < slides.length-1){ gs.ruleSlideIndex++; gs.ruleRevealIndex=0; }
  else gs.phase='ready';
  commit();
}
function retreatRule(){
  const slides=appData.ruleSlides;
  if(gs.ruleRevealIndex>0) gs.ruleRevealIndex--;
  else if(gs.ruleSlideIndex>0){ gs.ruleSlideIndex--; gs.ruleRevealIndex=slides[gs.ruleSlideIndex].groups.length-1; }
  commit();
}
/**
 * 出題者をランダムに選ぶ。一度選ばれた人は、全員が一度ずつ選ばれるまで選ばれない（全員済みでリセット）。
 * except：今回は選ばない人（選び直しの時の前の出題者）
 */
function chooseGiver(except){
  const conn=connectedPids();
  let pool=conn.filter(p=>!gs.usedGivers.includes(p) && p!==except);
  if(!pool.length){
    gs.usedGivers=[];   // 全員が一度ずつ出題した → リセット
    pool=conn.filter(p=>p!==except && p!==gs.lastGiver);   // リセット直後に同じ人が連続しないように
    if(!pool.length) pool=conn.filter(p=>p!==except);
    if(!pool.length) pool=conn;
  }
  return pool[Math.floor(Math.random()*pool.length)];
}
/** 出題者の数字を、管理ページで設定した出やすさ（重み）でランダムに選ぶ */
function randomTarget(){
  const list=numberProbs(normalizeSettings(S()));
  let x=Math.random();
  for(const it of list){ x-=it.p; if(x<0) return it.v; }
  return list[list.length-1].v;
}
function drawGiver(except){
  if(connectedPids().length<MIN_PLAYERS){ alert(`出題者と解答者で、接続中の参加者が${MIN_PLAYERS}人以上必要です`); return; }
  const onBoard = gs.round && gs.round.item ? [itemKey(gs.round.item)] : [];
  const item=pickItem(onBoard);
  if(!item) return;
  const giverId=chooseGiver(except);
  const practice=isPracticeNow();
  // 例題で選ばれた出題者は「出題済み」に数えない（本番でも同じように選ばれる）
  if(!practice){ gs.usedGivers.push(giverId); gs.lastGiver=giverId; }
  gs.boardWords.push(itemKey(item));
  gs.round={ id:uid(), label:roundLabel(), practice, giverId, item, target:randomTarget(),
             revealed:false, answer:null };
  gs.timer=null;
  gs.phase='selected';
  commit();
  playDrawAnim();
}
function redrawGiver(){
  const r=gs.round; if(!r) return;
  if(!confirm(`出題者を選び直しますか？\n（${pname(r.giverId)}さんは今回の出題をしなかった扱いに戻ります。お題と数字も新しくなります）`)) return;
  gs.usedGivers=gs.usedGivers.filter(p=>p!==r.giverId);
  drawGiver(r.giverId);
}
/** 出題者の抽選演出（名前がくるくる変わってから決定） */
function playDrawAnim(){
  clearInterval(drawAnimTimer);
  const names=connectedPids().map(pname);
  const t0=Date.now();
  drawAnimTimer=setInterval(()=>{
    const el=document.getElementById('giver-name');
    if(Date.now()-t0 > 1800 || !gs.round){
      clearInterval(drawAnimTimer); drawAnimTimer=null;
      if(gs.round && !gs.round.revealed){ gs.round.revealed=true; commit(); }
      return;
    }
    if(el && names.length) el.textContent=names[Math.floor(Math.random()*names.length)];
  }, 90);
}
/** 入れ替え候補（今のお題・今の候補以外の未使用お題からランダム）。なければ使用状況のリセットを確認 */
function nextCandidate(curCand){
  const oldK=itemKey(gs.round.item);
  let pool=availablePool([oldK]).filter(it=>!curCand || itemKey(it)!==itemKey(curCand));
  if(!pool.length){
    if(curCand){ showToast('ほかの候補がありません'); return null; }
    if(usableCount()-1<=0){ alert('入れ替えに使えるお題がありません'); return null; }
    if(!confirm('未使用のお題がなくなりました。\nお題の使用状況をリセットしますか？\n（除外したお題はそのままです）')) return null;
    setUsed(new Set([oldK]));
    pool=availablePool([oldK]);
    if(!pool.length){ alert('入れ替えに使えるお題がありません'); return null; }
  }
  return pool[Math.floor(Math.random()*pool.length)];
}
/** お題の入れ替えポップアップ（ホスト画面のみ）。候補は引き直せる（引き直した候補は使用済みにしない） */
function openSwap(){
  const r=gs.round; if(!r || !['selected','think'].includes(gs.phase)) return;
  const oldIt=r.item, rid=r.id;
  let cand=nextCandidate(null);
  if(!cand) return;
  const candHtml=it=>`◀ ${esc(it[0])} ⇔ ${esc(it[1])} ▶`;
  const m=openModal(`
    <h3>お題を入れ替え</h3>
    <p>今のお題：<b>${esc(oldIt[0])} ⇔ ${esc(oldIt[1])}</b></p>
    <p style="font-size:13px;color:#666">新しいお題（未使用のお題からランダム）</p>
    <div class="swap-cand" id="cand-item">${candHtml(cand)}</div>
    <div style="text-align:center"><button id="btn-reroll">🎲 別のお題にする</button></div>
    <label class="chk"><input type="checkbox" id="chk-ex"><span>今のお題を除外リストに入れる<br><small style="color:#666">（今後このゲームで選ばれなくなります。管理ページで確認・解除できます）</small></span></label>
    <p style="font-size:13px;color:#666">※出題者の数字はそのままです</p>
  `, [
    {label:'キャンセル'},
    {label:'入れ替える', cls:'primary', onClick:()=>{
      if(!gs.round || gs.round.id!==rid || !['selected','think'].includes(gs.phase)) return;
      const ex=m.el.querySelector('#chk-ex').checked;
      const used=getUsed(); used.add(itemKey(cand)); setUsed(used);
      gs.boardWords.push(itemKey(cand));
      if(ex){ const e=getExcluded(); e.add(itemKey(oldIt)); setExcluded(e); }
      gs.round.item=cand;
      commit();
      showToast(`お題を入れ替えました${ex?'（元のお題を除外リストに追加）':''}`);
    }}
  ]);
  m.el.querySelector('#btn-reroll').onclick=()=>{
    const c=nextCandidate(cand);
    if(c){ cand=c; m.el.querySelector('#cand-item').innerHTML=candHtml(c); }
  };
}
function startTimer(kind){
  const sec = kind==='think' ? S().thinkSec : S().guessSec;
  gs.timer={ id:uid(), kind, endsAt:Date.now()+sec*1000, durMs:sec*1000 };
}
function startThink(){ if(gs.phase!=='selected') return; gs.phase='think'; startTimer('think'); commit(); }
function startGuess(){ if(!['selected','think'].includes(gs.phase)) return; gs.phase='guess'; startTimer('guess'); commit(); }
function confirmAnswer(){
  const r=gs.round, s=S();
  if(gs.phase!=='guess' || r.answer==null) return;
  if(!confirm(`解答「${r.answer}」で決定しますか？`)) return;
  const diff=r.answer-r.target;
  gs.rounds.push({ id:r.id, label:r.label, practice:r.practice, giverId:r.giverId, giverName:pname(r.giverId),
                   left:r.item[0], right:r.item[1], target:r.target, answer:r.answer, diff, pts:ptsFor(diff, s.tiers) });
  gs.timer=null;
  gs.phase='result';
  commit();
}
function undoAnswer(){
  if(gs.phase!=='result') return;
  if(!confirm('この問題の解答をやり直しますか？\n（解答を選ぶ画面に戻ります。得点は取り消されます）')) return;
  gs.rounds.pop();
  gs.phase='guess';
  commit();
}
function goFinal(){
  const counted=countedRounds();
  if(!counted.length){ alert('まだ得点の入る問題を出題していません'); return; }
  if(!confirm('ゲームを終了して結果発表に進みますか？')) return;
  const s=S(), n=counted.length, total=counted.reduce((a,r)=>a+r.pts,0), target=clearTarget(n, s);
  const clear = total>=target;
  const now=Date.now();
  gs.finalResult={ n, total, target, clear, formula:clearFormula(s), at:now };
  gs.round=null; gs.timer=null;
  gs.phase='final';
  const h=getHistory();
  h.push({ id:uid(), at:now, result:clear?'clear':'fail', questions:n, total, target,
           clearMs: clear && gs.startedAt ? now-gs.startedAt : null,
           players: gs.order.filter(p=>gs.players[p]).map(pname).join('、'),
           words: gs.boardWords.slice() });
  setHistory(h);
  commit();
}
function playAgain(){
  gs.phase='lobby'; gs.rounds=[]; gs.round=null; gs.timer=null; gs.usedGivers=[]; gs.lastGiver=null;
  gs.boardWords=[]; gs.finalResult=null; gs.settings=null; gs.startedAt=null;
  commit();
}

/* ----- タイマー表示（画面全体は描き直さず数字だけ更新） ----- */
function beep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(off=>{
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination);
      const t=audioCtx.currentTime+off; g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
      o.start(t); o.stop(t+0.3);
    });
  }catch(e){}
}
function tickHostTimer(){
  if(!gs || !gs.timer) return;
  const el=document.getElementById('host-timer'); if(!el) return;
  const ms=Math.max(0, gs.timer.endsAt-Date.now());
  const sec=Math.ceil(ms/1000);
  el.innerHTML=`${sec}<span class="unit">秒</span>`;
  el.classList.toggle('zero', ms<=0);
  const msg=document.getElementById('host-timer-msg');
  if(msg) msg.textContent = ms<=0 ? '⏰ 時間です！' : '';
  if(ms<=0 && beepedTimerId!==gs.timer.id){ beepedTimerId=gs.timer.id; if(Date.now()-gs.timer.endsAt<3000) beep(); }
}

function kickPlayer(pid){
  if(!gs.players[pid] || !confirm(`${pname(pid)}さんを参加者から外しますか？`)) return;
  sendTo(pid, {type:'removed'});
  const c=conns[pid]; delete conns[pid]; connected.delete(pid);
  delete gs.players[pid];
  gs.order=gs.order.filter(p=>p!==pid);
  gs.usedGivers=gs.usedGivers.filter(p=>p!==pid);
  setTimeout(()=>{ try{ c&&c.close(); }catch(err){} }, 300);

function onHostClick(e){
  const cell=e.target.closest('.mcell.pick');
  if(cell && gs.phase==='guess'){ gs.round.answer=Number(cell.dataset.num); saveState(); renderHost(); return; }
  const b=e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const act=b.dataset.act;
  // 音を鳴らせるように、最初の操作でAudioContextを用意しておく
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(err){}
  if(act==='qr') openQrModal();
  else if(act==='admin'){ if(gs.phase==='lobby' || confirm('管理ページを開きますか？\n（ゲームの進行状況は保存されます。戻ると「続きから再開」できます）')) location.href=location.pathname+'?mode=admin'; }
  else if(act==='newroom'){
    if(!confirm('新しい部屋を作り直しますか？\n（今の進行状況は消え、スマホはQRから入り直しになります）')) return;
    localStorage.removeItem(LS.state); localStorage.removeItem(LS.room);
    location.reload();
  }
  else if(act==='kick') kickPlayer(b.dataset.pid);
  else if(act==='start') startGame(true);
  else if(act==='start-norule') startGame(false);
  else if(act==='rule-next') advanceRule();
  else if(act==='rule-prev') retreatRule();
  else if(act==='rule-skip'){ gs.phase='ready'; commit(); }
  else if(act==='draw') drawGiver(null);
  else if(act==='redraw') redrawGiver();
  else if(act==='swap') openSwap();
  else if(act==='think') startThink();
  else if(act==='guess') startGuess();
  else if(act==='ans-minus'||act==='ans-plus'){
    const s=S(), r=gs.round, d=act==='ans-plus'?1:-1;
    const base = r.answer==null ? Math.round((s.meterMin+s.meterMax)/2) : r.answer+d;
    r.answer=Math.max(s.meterMin, Math.min(s.meterMax, base)); saveState(); renderHost();
  }
  else if(act==='confirm') confirmAnswer();
  else if(act==='undo') undoAnswer();
  else if(act==='final') goFinal();
  else if(act==='again') playAgain();
}

let myPeer=null, myConn=null, myPid='', myName='', sub=null, removedByHost=false, subTimerEnds=null, subTick=null, lastRoundId=null;

function initSub(){
  requestWakeLock();
  myPid=sessionStorage.getItem(SS_PID) || uid();
  sessionStorage.setItem(SS_PID, myPid);
  myName=sessionStorage.getItem(SS_NAME) || '';
  renderConnecting();
  subTick=setInterval(tickSubTimer, 250);
  myPeer=new Peer();
  myPeer.on('open', ()=>connectToHost(params.get('room')));
  myPeer.on('disconnected', ()=>{ try{ myPeer.reconnect(); }catch(e){} });
  myPeer.on('error', err=>console.error(err));
}
function connectToHost(roomId){
  let timer=null;
  const retry=()=>{ if(removedByHost) return; clearTimeout(timer); timer=setTimeout(tryConnect, 3000); };
  function tryConnect(){
    if(removedByHost) return;
    try{
      const conn=myPeer.connect(roomId, {reliable:true});
      myConn=conn;
      conn.on('open', ()=>{ if(myName) sendJoin(); else renderNameForm(''); });
      conn.on('data', handleHostMessage);
      conn.on('close', ()=>{ if(myConn===conn){ renderConnecting(); retry(); } });
      conn.on('error', ()=>{ if(myConn===conn) retry(); });
      setTimeout(()=>{ if(myConn===conn && !conn.open){ try{ conn.close(); }catch(e){} retry(); } }, 8000);
    }catch(e){ retry(); }
  }
  tryConnect();
}
function sendHost(msg){ if(myConn && myConn.open){ try{ myConn.send(msg); return true; }catch(e){} } showToast('通信が切れています。再接続をお待ちください'); return false; }
function sendJoin(){ sendHost({type:'join', pid:myPid, name:myName}); }
function renderConnecting(){
  document.getElementById('app').innerHTML=`<div class="page"><div class="p-center"><div class="spinner"></div>
    <p>ホスト画面に接続しています…</p><p class="muted" style="font-size:13px">つながらない場合はそのまま少しお待ちください（自動で再接続します）</p></div></div>`;

/** 入力欄から設定を読み取る。errors に問題点 */
function readSettings(){
  readTierRows();
  const v=id=>toInt(document.getElementById(id).value);
  const s={ thinkSec:v('s-think'), guessSec:v('s-guess'), meterMin:v('s-min'), meterMax:v('s-max'),
            clearMul:v('s-mul'), clearAdd:v('s-add'), practiceFirst:document.getElementById('s-practice').checked,
            weights:[v('s-w1'), v('s-w2'), v('s-w3')], weightsV:2,
            tiers:adminTiers.map(t=>({err:toInt(t.err), pts:toInt(t.pts)})) };
  const errors=[];
  if(isNaN(s.thinkSec)||s.thinkSec<1) errors.push('出題シンキングタイムは1以上の整数で入力してください');
  if(isNaN(s.guessSec)||s.guessSec<1) errors.push('予想シンキングタイムは1以上の整数で入力してください');
  if(isNaN(s.meterMin)||isNaN(s.meterMax)) errors.push('メーターの数字は整数で入力してください');
  else if(s.meterMin>=s.meterMax) errors.push('メーターは「一番左」より「一番右」を大きくしてください');
  else if(s.meterMax-s.meterMin>200) errors.push('メーターの数字の範囲は201個以内にしてください');
  if(!s.tiers.length) errors.push('得点帯を1つ以上登録してください');
  if(s.tiers.some(t=>isNaN(t.err)||t.err<0)) errors.push('誤差は0以上の整数で入力してください');
  if(s.tiers.some(t=>isNaN(t.pts))) errors.push('点数は整数で入力してください');
  const errs=s.tiers.map(t=>t.err).filter(x=>!isNaN(x));
  if(errs.some((x,i)=>errs.indexOf(x)!==i)) errors.push('同じ誤差の得点帯が重複しています');
  if(isNaN(s.clearMul)||isNaN(s.clearAdd)) errors.push('クリア条件の数字は整数で入力してください');
  if(s.weights.some(x=>isNaN(x)||x<0)) errors.push('数字の出やすさは0以上の整数で入力してください');
  else if(!s.weights.some(x=>x>0)) errors.push('数字の出やすさは、どれか1つは1以上にしてください');
  s.tiers.sort((a,b)=>a.err-b.err);
  return {s, errors};
}

function compressDataUrl(src, maxDim, quality){
  maxDim=maxDim||1000; quality=quality||0.8;
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>h){ if(w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} } else { if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;} }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=reject; img.src=src;
  });
}
function compressImageFile(file){
  return new Promise((resolve,reject)=>{ const rd=new FileReader(); rd.onload=e=>compressDataUrl(e.target.result).then(resolve,reject); rd.onerror=reject; rd.readAsDataURL(file); });
}

function attachRuleSlidesEvents(){
  const container=document.getElementById('rule-editor');
  container.addEventListener('mousedown', e=>{ if(e.target.closest('.rich-toolbar')) e.preventDefault(); });
  container.addEventListener('click', e=>{
    const btn=e.target.closest('[data-ract]'); if(!btn || btn.disabled) return;
    const act=btn.dataset.ract;
    if(act==='slide-add'){ appData.ruleSlides.push({img:null, groups:['']}); renderRuleSlidesEditor(); return; }
    const slideCard=btn.closest('.rule-slide-card'); if(!slideCard) return;
    const si=Number(slideCard.dataset.si), slides=appData.ruleSlides, slide=slides[si];
    const groupBlock=btn.closest('.rule-group-block'), gi=groupBlock?Number(groupBlock.dataset.gi):null;
    if(act==='slide-up'){ [slides[si-1],slides[si]]=[slides[si],slides[si-1]]; renderRuleSlidesEditor(); }
    else if(act==='slide-down'){ [slides[si+1],slides[si]]=[slides[si],slides[si+1]]; renderRuleSlidesEditor(); }
    else if(act==='slide-del'){ if(confirm('このページを削除しますか？')){ slides.splice(si,1); renderRuleSlidesEditor(); } }
    else if(act==='slide-img-remove'){ slide.img=null; renderRuleSlidesEditor(); }
    else if(act==='group-add'){ slide.groups.push(''); renderRuleSlidesEditor(); }
    else if(act==='group-up'){ [slide.groups[gi-1],slide.groups[gi]]=[slide.groups[gi],slide.groups[gi-1]]; renderRuleSlidesEditor(); }
    else if(act==='group-down'){ [slide.groups[gi+1],slide.groups[gi]]=[slide.groups[gi],slide.groups[gi+1]]; renderRuleSlidesEditor(); }
    else if(act==='group-del'){ slide.groups.splice(gi,1); renderRuleSlidesEditor(); }
    else if(act==='group-ins-above'||act==='group-ins-below'){
      const at = act==='group-ins-above' ? gi : gi+1;
      slide.groups.splice(at,0,''); renderRuleSlidesEditor();
      const el=document.querySelectorAll(`#rule-editor .rule-slide-card[data-si="${si}"] .rule-group-edit`)[at];
      if(el) el.focus();
    }
    else if(act==='fmt'){
      const editEl=groupBlock.querySelector('.rule-group-edit');
      editEl.focus();
      const cmd=btn.dataset.cmd;
      if(cmd==='upsize') wrapSelectionBig();
      else if(cmd==='colorclass') wrapSelectionClass(btn.dataset.val);
      else document.execCommand(cmd, false, null);
      slide.groups[gi]=editEl.innerHTML;
    }
  });
  // 貼り付けは書式（文字色・サイズ）を外して文字だけにする
  container.addEventListener('paste', e=>{
    if(!e.target.closest('.rule-group-edit')) return;
    e.preventDefault();
    const text=(e.clipboardData||window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });
  container.addEventListener('input', e=>{
    const editEl=e.target.closest('.rule-group-edit'); if(!editEl) return;
    appData.ruleSlides[Number(editEl.closest('.rule-slide-card').dataset.si)].groups[Number(editEl.closest('.rule-group-block').dataset.gi)]=editEl.innerHTML;
  });
  container.addEventListener('change', async e=>{
    if(e.target.dataset.ract!=='slide-img-input') return;
    const si=Number(e.target.closest('.rule-slide-card').dataset.si), f=e.target.files[0]; if(!f) return;
    appData.ruleSlides[si].img=await compressImageFile(f);
    renderRuleSlidesEditor();
  });
}
function wrapSelectionBig(){
  const sel=window.getSelection(); if(!sel.rangeCount) return;
  const range=sel.getRangeAt(0); if(range.collapsed) return;
  const span=document.createElement('span'); span.style.fontSize='1.5em';
  span.appendChild(range.extractContents()); range.insertNode(span);
  // 色クラス付きspanの中で拡大した場合、拡大した要素自身にも色クラスを持たせてハイライト枠を拡大後サイズで描画させる
  const parent=span.parentNode;
  if(parent && parent.classList && (parent.classList.contains('rule-red')||parent.classList.contains('rule-normal'))){
    span.classList.add(parent.classList.contains('rule-red')?'rule-red':'rule-normal');
    const others=Array.from(parent.childNodes).filter(n=>n!==span && !(n.nodeType===3 && n.textContent===''));
    if(!others.length && parent.parentNode){ parent.parentNode.insertBefore(span, parent); parent.parentNode.removeChild(parent); }
  }
}
function wrapSelectionClass(cls){
  const sel=window.getSelection(); if(!sel.rangeCount) return;
  const range=sel.getRangeAt(0); if(range.collapsed) return;
  const frag=range.extractContents();
  // 入れ子になった古い色クラスを剥がしてから付け直す
  const strip=node=>{ if(node.nodeType===1){ if(node.classList){ node.classList.remove('rule-red','rule-normal'); if(!node.classList.length) node.removeAttribute('class'); } Array.from(node.childNodes).forEach(strip); } };
  Array.from(frag.childNodes).forEach(strip);
  const span=document.createElement('span'); span.className=cls;
  span.appendChild(frag); range.insertNode(span);
  let node=span;
  while(node.parentNode && node.parentNode.classList && (node.parentNode.classList.contains('rule-red')||node.parentNode.classList.contains('rule-normal'))){
    const parent=node.parentNode;
    if(Array.from(parent.childNodes).some(n=>n!==node && !(n.nodeType===3 && n.textContent===''))) break;
    const gp=parent.parentNode; if(!gp) break;
    gp.insertBefore(node, parent); gp.removeChild(parent);
  }
}

/* ---- 履歴・除外・使用状況・お題リスト ---- */
function renderPool(){
  const items=getItemList(), keys=items.map(itemKey), used=getUsed(), ex=getExcluded(), hist=getHistory().slice().reverse();
  const usedCnt=keys.filter(k=>used.has(k) && !ex.has(k)).length;
  const exCnt=keys.filter(k=>ex.has(k)).length;
  const remain=keys.length-usedCnt-exCnt;
  const custom=Array.isArray(lsGet(LS.items,null));
  const clears=hist.filter(h=>h.result==='clear').length;
  document.getElementById('pool-area').innerHTML=`
    <div class="card">
      <h2>プレイ履歴</h2>
      <p class="muted" style="margin-top:-6px">全${hist.length}回 ／ クリア ${clears}回 ／ 失敗 ${hist.length-clears}回</p>
      ${hist.length ? `<div class="table-wrap"><table><thead><tr><th>遊んだ日時</th><th>結果</th><th>問題数</th><th>得点</th><th>クリア時間</th><th>参加者</th><th></th></tr></thead><tbody>
        ${hist.map(h=>`<tr>
          <td style="white-space:nowrap">${fmtDate(h.at)}</td>
          <td><span class="tag ${h.result}">${h.result==='clear'?'クリア':'失敗'}</span></td>
          <td style="white-space:nowrap">${h.questions}問</td>
          <td style="white-space:nowrap">${h.total}点 <span class="muted">/ ${h.target}点</span></td>
          <td style="white-space:nowrap">${h.result==='clear' && h.clearMs!=null ? fmtDuration(h.clearMs) : '—'}</td>
          <td>${esc(h.players||'')}</td>
          <td><button class="small ghost" data-act="delhist" data-id="${esc(h.id)}">削除</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="row" style="margin-top:10px"><span class="spacer"></span><button class="small danger" data-act="clearhist">履歴をすべて削除</button></div>`
      : '<p class="muted">まだ記録がありません。</p>'}
    </div>

    <div class="card">
      <h2>除外お題リスト（${exCnt}件）</h2>
      <p class="muted" style="margin-top:-6px">ここにあるお題はゲームで選ばれません。「解除」で再び選ばれるようになります。</p>
      <div class="row" style="margin-bottom:12px">
        <select id="ex-select" style="max-width:520px"><option value="">（除外したいお題を選ぶ）</option>${keys.filter(k=>!ex.has(k)).map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('')}</select>
        <button data-act="addex">除外に追加</button>
      </div>
      ${ex.size ? `<div class="ex-list">${[...ex].map(k=>`<span class="ex-item">${esc(k)}<button class="small ghost" data-act="unex" data-k="${esc(k)}">解除</button></span>`).join('')}</div>`
                : '<p class="muted">除外しているお題はありません。</p>'}
    </div>

    <div class="card">
      <h2>お題の使用状況</h2>
      <div class="stats4">
        <div class="stat"><div class="lbl">お題リスト</div><div class="val">${keys.length}</div></div>
        <div class="stat"><div class="lbl">使用済み</div><div class="val">${usedCnt}</div></div>
        <div class="stat"><div class="lbl">未使用</div><div class="val" style="color:var(--accent)">${remain}</div></div>
        <div class="stat"><div class="lbl">除外</div><div class="val">${exCnt}</div></div>
      </div>
      <p class="muted">一度出たお題は、すべてのお題が一度ずつ使われるまで出ません（あと${remain}問分）。<br>
        未使用がなくなると、出題者を決める時にリセットするか確認します。</p>
      <button class="danger" data-act="resetused">使用状況をリセット</button>
    </div>

    <div class="card">
      <h2>お題リスト</h2>
      <p class="muted" style="margin-top:-6px">現在：${custom?'貼り付けたリスト':'初期リスト（スプレッドシート「単語リスト」E列・F列）'}　${keys.length}件</p>
      <p style="font-size:14px">スプレッドシートのお題を更新した時は、<b>E列とF列を2列まとめてコピー</b>して下に貼り付け（1行1お題・左端と右端はタブ区切り）→「このリストに置き換える」を押してください。</p>
      <textarea id="items-input" rows="6" placeholder="左端のお題[TAB]右端のお題"></textarea>
      <div class="row" style="margin-top:10px">
        <button data-act="setitems">このリストに置き換える</button>
        ${custom?'<button class="ghost" data-act="defitems">初期リストに戻す</button>':''}
      </div>
      <details style="margin-top:12px"><summary class="muted">いまのお題リストを見る</summary>
        <ol style="font-size:14px;line-height:1.7">${keys.map(k=>`<li>${esc(k)}${ex.has(k)?' <span class="tag fail">除外</span>':used.has(k)?' <span class="muted">（使用済み）</span>':''}</li>`).join('')}</ol></details>
    </div>

    <div class="card">
      <h2>データの引き継ぎ</h2>
      <p class="muted" style="margin-top:-6px">ゲーム設定・ルール説明（画像含む）・履歴・除外お題・使用状況・お題リストをJSONファイルで書き出し／読み込みできます（別のPCへの引き継ぎやバックアップ用）。</p>
      <div class="row">
        <button data-act="export">⬇ JSON書き出し</button>
        <button data-act="import">⬆ JSON読み込み</button>
        <input type="file" id="import-file" accept=".json,application/json" style="display:none">
      </div>
    </div>`;
  document.getElementById('import-file').onchange=onImportFile;
}
/** 削除した履歴の回で使ったお題を「未使用」に戻す */
function unuseWords(entries){
  const used=getUsed();
  entries.forEach(h=>(h.words||[]).forEach(w=>used.delete(w)));
  setUsed(used);
}
function onAdminClick(e){
  const b=e.target.closest('[data-act]'); if(!b || b.disabled) return;
  const act=b.dataset.act;
  if(act==='tohost') location.href=location.pathname;
  else if(act==='save') saveAdmin(false);
  else if(act==='save-go') saveAdmin(true);
  else if(act==='tier-add'){ readTierRows(); const last=adminTiers[adminTiers.length-1]; adminTiers.push({err:last?toInt(last.err)+1||0:0, pts:0}); renderTierRows(); updateSettingsPreview(); }
  else if(act==='tier-del'){ readTierRows(); adminTiers.splice(Number(b.dataset.i),1); renderTierRows(); updateSettingsPreview(); }
  else if(act==='delhist'){
    if(!confirm('この履歴を削除しますか？\n（この回で使ったお題は「未使用」に戻ります）')) return;
    const all=getHistory();
    unuseWords(all.filter(h=>h.id===b.dataset.id));
    setHistory(all.filter(h=>h.id!==b.dataset.id)); renderPool();
  }
  else if(act==='clearhist'){
    if(!confirm('プレイ履歴をすべて削除しますか？（元に戻せません）\n（履歴に残っている回で使ったお題は「未使用」に戻ります）')) return;
    unuseWords(getHistory()); setHistory([]); renderPool();
  }
  else if(act==='unex'){ const s=getExcluded(); s.delete(b.dataset.k); setExcluded(s); renderPool(); }
  else if(act==='addex'){
    const v=document.getElementById('ex-select').value; if(!v) return;
    const s=getExcluded(); s.add(v); setExcluded(s); renderPool();
  }
  else if(act==='resetused'){ if(!confirm('お題の使用状況をリセットしますか？\n（すべてのお題がまた選ばれるようになります。除外お題はそのままです）')) return; setUsed(new Set()); renderPool(); }
  else if(act==='setitems'){
    const lines=document.getElementById('items-input').value.split(/\r?\n/).filter(l=>l.trim());
    const list=[]; let skipped=0;
    lines.forEach(l=>{ const c=l.split('\t').map(x=>x.trim()); if(c.length>=2 && c[0] && c[1] && !/^#N\/A$/i.test(c[1])) list.push([c[0],c[1]]); else skipped++; });
    if(!list.length){ alert('お題を読み取れませんでした。\nスプレッドシートのE列とF列を2列まとめてコピーして貼り付けてください。'); return; }
    if(!confirm(`${list.length}件のお題リストに置き換えますか？${skipped?`\n（左端・右端のどちらかが空の${skipped}行は読み飛ばします）`:''}`)) return;
    lsSet(LS.items, list); document.getElementById('items-input').value=''; renderPool();
  }
  else if(act==='defitems'){ if(!confirm(`初期リスト（${DEFAULT_ITEMS.length}件）に戻しますか？`)) return; localStorage.removeItem(LS.items); renderPool(); }
  else if(act==='export'){
    const data={app:'wmeter', version:1, exportedAt:new Date().toISOString(), appData,
      items:lsGet(LS.items,null), used:lsGet(LS.used,[]), excluded:lsGet(LS.excluded,[]), history:lsGet(LS.history,[])};
    const blob=new Blob([JSON.stringify(data,null,1)], {type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    const d=new Date(); a.download=`wavemeter_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }
  else if(act==='import') document.getElementById('import-file').click();
}
function onImportFile(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=async ()=>{
    try{
      const d=JSON.parse(rd.result);
      if(d.app!=='wmeter') throw new Error('format');
      if(!confirm('読み込んだデータで、今のデータ（ゲーム設定・ルール説明・履歴・除外お題・使用状況・お題リスト）を上書きしますか？')) return;
      if(d.appData) await idbSet(mergeAppData(d.appData));
      if(Array.isArray(d.items)&&d.items.length) lsSet(LS.items, d.items); else localStorage.removeItem(LS.items);
      lsSet(LS.used, Array.isArray(d.used)?d.used:[]);
      lsSet(LS.excluded, Array.isArray(d.excluded)?d.excluded:[]);
      lsSet(LS.history, Array.isArray(d.history)?d.history:[]);
      alert('読み込みました'); location.reload();
    }catch(err){ alert('このファイルは読み込めませんでした'); }
  };
  rd.readAsText(f);
  e.target.value='';
}

/* ---------- 起動 ---------- */
if(MODE==='admin') initAdmin();
else if(MODE==='sub') initSub();
else initHost();
</script>
